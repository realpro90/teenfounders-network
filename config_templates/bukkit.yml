# TeenFounders Build Network - Bukkit Configuration
# Optimized for Paper 1.21.11 Creative Server

settings:
  allow-end: false
  warn-on-overload: false
  permissions-file: permissions.yml
  update-folder: update
  plugin-profiling: false
  connection-throttle: 4000
  query-plugins: true
  deprecated-verbose: default
  shutdown-message: "§c[TeenFounders] Server is restarting for maintenance..."

spawn-limits:
  monsters: 0
  animals: 10
  water-animals: 0
  water-ambient: 0
  water-underground-creature: 0
  axolotls: 0
  ambient: 0

chunk-gc:
  period-in-ticks: 400

ticks-per:
  animal-spawns: 400
  monster-spawns: 0
  water-spawns: 0
  water-ambient-spawns: 0
  water-underground-creature-spawns: 0
  axolotl-spawns: 0
  ambient-spawns: 0
  autosave: 6000

aliases: noworld
