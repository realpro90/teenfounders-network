# ==============================================================================
# TeenFounders Network - PaperMC Global Configuration Template
# Enables BungeeCord IP & Profile Forwarding and disables Chat Signatures
# ==============================================================================

_version: 30

proxies:
  bungeecord:
    online-mode: false
  velocity:
    enabled: false
    online-mode: false
    secret: ""

setting:
  enforce-secure-profile: false

unsupported-settings:
  allow-piston-duplication: false
  perform-username-validation: false

messages:
  kick:
    authentication-servers-down: "§c[TeenFounders] Authentication servers are down. Please try again later."
    connection-throttle: "§c[TeenFounders] Connection throttled. Please wait a moment."
    flying-player: "§c[TeenFounders] Flying is not enabled on this server."
    flying-vehicle: "§c[TeenFounders] Flying is not enabled on this server."

chunk-loading:
  min-load-radius: 2
  max-concurrent-sends: 2
  autoconfig-send-distance: true

watchdog:
  early-warning-every: 5000
  early-warning-delay: 10000
