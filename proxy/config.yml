# ==============================================================================
# TeenFounders Network - Proxy Server Configuration (BungeeCord / Waterfall)
# Listens on 0.0.0.0:25565 and routes traffic to backend Paper servers
# ==============================================================================

listeners:
- query_port: 25565
  motd: '&6&lTEENFOUNDERS NETWORK &7[1.21.11]\n&eCreative Plots &7| &bBuild Offs &7| &aSurvival Events'
  tab_list: GLOBAL_PING
  query_enabled: true
  proxy_protocol: false
  forced_hosts: {}
  ping_passthrough: false
  priorities:
  - lobby
  bind_local_address: true
  host: 0.0.0.0:25565
  max_players: 100
  tab_size: 60
  force_default_server: true

remote_ping_cache: -1
network_compression_threshold: 256
permissions:
  default:
  - bungeecord.command.server
  - bungeecord.command.list
  admin:
  - bungeecord.command.end
  - bungeecord.command.alert
  - bungeecord.command.reload

log_pings: false
connection_throttle_limit: 3
prevent_proxy_connections: false
timeout: 30000
player_limit: -1
ip_forward: true
online_mode: false

servers:
  lobby:
    motd: '&6TeenFounders Lobby'
    address: lobby.railway.internal:25565
    restricted: false
  creative:
    motd: '&6TeenFounders Creative Plots'
    address: creative.railway.internal:25565
    restricted: false
  competition:
    motd: '&6TeenFounders Build Competition'
    address: competition.railway.internal:25565
    restricted: false
  survival-event:
    motd: '&6TeenFounders 15-Day Survival Event'
    address: survival-event.railway.internal:25565
    restricted: false
  pvp:
    motd: '&6TeenFounders PvP Arena'
    address: pvp.railway.internal:25565
    restricted: false
