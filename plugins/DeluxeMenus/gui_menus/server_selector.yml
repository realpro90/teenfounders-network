# ==============================================================================
# TeenFounders Network - Premium Master Server Selector GUI Navigator
# Inspired by Hypixel, styled with TeenFounders Orange/White/Black Palette
# Auto-opens directly on screen when players join the lobby!
# ==============================================================================

menu_title: '§6§lTF NETWORK §8| Master Server Navigator'
open_command:
  - menu
  - server
  - selector
  - navigate
open_on_join: true
size: 36

items:
  'filler_header':
    material: BLACK_STAINED_GLASS_PANE
    slots: [0, 1, 2, 3, 4, 5, 6, 7, 8, 27, 28, 29, 30, 31, 32, 33, 34, 35]
    display_name: ' '

  'orange_accent':
    material: ORANGE_STAINED_GLASS_PANE
    slots: [9, 17, 18, 26]
    display_name: '§6§lTEENFOUNDERS NETWORK'

  'lobby_server':
    material: NETHER_STAR
    slot: 10
    display_name: '§6§lMAIN HUB & LOBBY'
    lore:
      - '§7Central arrival hub & social lounge.'
      - '§7Connect with teen founders, creators & devs.'
      - ''
      - '§fNetwork: §eTeenFounders Main Hub'
      - '§fStatus: §aONLINE §7(Click to Join)'
    left_click_commands:
      - '[server] lobby'

  'creative_plots':
    material: GRASS_BLOCK
    slot: 12
    display_name: '§6§lCREATIVE PLOT WORLDS'
    lore:
      - '§7Claim your own 64x64 plot and start building.'
      - '§7Full WorldEdit & FAWE support enabled.'
      - '§7Rank up from Builder -> Architect -> Master.'
      - ''
      - '§fCommands: §e/p auto§7, §e/p claim'
      - '§fStatus: §aONLINE §7(Click to Join)'
    left_click_commands:
      - '[server] creative'

  'competition_world':
    material: GOLD_BLOCK
    slot: 14
    display_name: '§e§lBUILDING COMPETITION ARENA'
    lore:
      - '§7Join active timed building competitions!'
      - '§7Compete for custom ranks & badges.'
      - '§7Evaluated by Community & Guest Judges.'
      - ''
      - '§fStatus: §aACTIVE CONTEST'
      - '§fClick to Enter Competition!'
    left_click_commands:
      - '[server] competition'

  'survival_championship':
    material: NETHERITE_SWORD
    slot: 15
    display_name: '§c§l15-DAY SURVIVAL CHAMPIONSHIP'
    lore:
      - '§7Flagship 15-Day Survival Competition!'
      - '§7Gather resources, form alliances & build.'
      - '§7Day 15 Finale: Shrinking World Border Arena.'
      - '§7Winner gets Champion title & Verification Token!'
      - ''
      - '§fStatus: §aSEASON 1 ACTIVE'
      - '§fClick to Teleport!'
    left_click_commands:
      - '[server] survival-event'

  'pvp_arena':
    material: DIAMOND_SWORD
    slot: 16
    display_name: '§b§lPVP ARENA & DUELS'
    lore:
      - '§7Test your combat skills in fast PvP duels.'
      - '§7Custom kits, 1v1 arenas & leaderboards.'
      - ''
      - '§fStatus: §aONLINE'
      - '§fClick to Join PvP!'
    left_click_commands:
      - '[server] pvp'

  'website_info':
    material: BOOK
    slot: 30
    display_name: '§e§lTEENFOUNDERS WEBSITE'
    lore:
      - '§7Visit our official website:'
      - '§fhttps://teenfounders.in'
      - ''
      - '§7Verify your Survival Champion token & ranks!'
    left_click_commands:
      - '[message] §6[TeenFounders] Visit our site: §ehttps://teenfounders.in'

  'close_button':
    material: BARRIER
    slot: 31
    display_name: '§c§lClose Navigator'
    left_click_commands:
      - '[close]'
