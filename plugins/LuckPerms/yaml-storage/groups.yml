# TeenFounders Build Network - LuckPerms Groups Configuration
# Ranks: Owner, Admin, Developer, Architect, Builder, VIP, Member, Guest

owner:
  permissions:
  - '*'
  meta:
    prefix: '&6&l[OWNER] '
    weight: '100'

admin:
  permissions:
  - essentials.*
  - worldguard.*
  - worldedit.*
  - fawe.*
  - coreprotect.*
  - citizens.*
  - deluxemenus.*
  - tab.*
  - luckperms.group.admin
  - luckperms.group.developer
  - luckperms.group.architect
  - luckperms.group.builder
  - luckperms.group.vip
  - luckperms.group.member
  - luckperms.group.guest
